<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Fiza ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1f6,#f9e7ff);display:flex;align-items:center;justify-content:center;color:#4a2940}.card{width:min(92%,620px);min-height:430px;padding:42px 30px;background:rgba(255,255,255,.95);border-radius:28px;box-shadow:0 18px 55px rgba(100,50,90,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:52px;margin-bottom:15px}h1{margin:0 0 18px;font-size:clamp(28px,7vw,46px)}p{margin:0;font-size:clamp(17px,4.2vw,21px);line-height:1.75;white-space:pre-line}button{margin-top:28px;border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:700;color:white;background:#d85a93;cursor:pointer}.small{margin-top:18px;font-size:14px;opacity:.65}
</style>
</head>
<body>
<div class="card">
<div class="emoji" id="emoji">❤️</div>
<h1 id="title">Fiza...</h1>
<p id="message">Ek choti si baat hai. Please end tak click karti jaana.</p>
<button id="btn">Theek hai, sun rahi hoon</button>
<div class="small" id="count">1 / 6</div>
</div>
<script>
const s=[
["❤️","Fiza...","Ek choti si baat hai. Please end tak click karti jaana.","Theek hai, sun rahi hoon"],
["🥺","I am really sorry...","Fiza, I am really sorry sb baton k liye jin ki wajah sy ap ka dil dukha hai.\nKasm sy meri kabhi bi intention nahi hoti k meri wajah se ap hurt ho ya ap ki aankhon mein ansu ayein. Kabhi kabhi mujh sy galti ho jati hai or shyd mujhy os waqt idea bi nhi hota k meri baat aap ko kitna hurt kr jaye gi.","Next"],
["💗","Fiza ap meri bestest friend ho..","Fiza ap meri bestest friend ho..or mery lye boht important ho. Mujhy pta hai ap Lahore mein akeli ho\nOr already boht si batein ap ko hurt kr rhi.\nMain kbhi nahi chahta k un sab ke beech meri wajah se bhi ap ko hurt hona parein.","Next"],
["🌸","A promise...","Ma genuinely promise krta hu k ma khud ko theek kru ga, aap ki feelings ko zyada samjhu ga or apni mistakes repeat nhi kru ga.","Next"],
["🫶","Please kabhi ye mtt sochna...","Or please kabhi ye mtt sochna k aap akeli ho. Chahy kuch bhi ho, main hamesha ap k saath hu.","Next"],
["🤍","I am really sorry, Ella g.❤️","I am really sorry, Ella g.❤️","Finish"]
];
let i=0;
const e=document.getElementById("emoji"),t=document.getElementById("title"),m=document.getElementById("message"),b=document.getElementById("btn"),c=document.getElementById("count");
function show(){
e.textContent=s[i][0];t.textContent=s[i][1];m.textContent=s[i][2];b.textContent=s[i][3];c.textContent=(i+1)+" / 6";
}
b.addEventListener("click",function(){
if(i<s.length-1){i++;show();}
else{
e.textContent="🥹❤️";t.textContent="For Fiza ❤️";m.textContent="Ab bas smile kar do. ❤️\n\nSorry for everything. You’re genuinely important to me.";b.textContent="Okay, smile 😊";c.textContent="";
b.onclick=function(){t.textContent="Thank You, Fiza! ❤️";m.textContent="Bas ab naraz mat rehna. 🥹";b.style.display="none";};
}
});
show();
</script>
</body>
</html>
