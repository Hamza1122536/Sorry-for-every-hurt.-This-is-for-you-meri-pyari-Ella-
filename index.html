<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Fiza ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif; background:linear-gradient(135deg,#ffd6e7,#fff4f8);
  color:#3d2430; overflow:hidden;
}
.card{
  width:min(92%,430px); padding:34px 25px; text-align:center; background:rgba(255,255,255,.92);
  border-radius:28px; box-shadow:0 15px 45px rgba(100,40,70,.18);
}
.heart{font-size:55px; animation:pulse 1.4s infinite}
h1{margin:10px 0 14px;font-size:30px}
p{font-size:17px;line-height:1.6;margin:12px 0 24px}
button{
  border:0; padding:14px 25px; border-radius:30px; background:#e75480;color:white;
  font-size:17px; font-weight:bold; cursor:pointer; box-shadow:0 7px 18px rgba(231,84,128,.3);
}
button:hover{transform:scale(1.03)}
.small{font-size:14px;color:#8b6573;margin-top:18px}
.hidden{display:none}
.final{font-size:24px;font-weight:bold}
@keyframes pulse{50%{transform:scale(1.12)}}
.confetti{position:fixed;top:-20px;font-size:22px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div id="screen"></div>
</div>

<script>
const screens = [
  ["❤️","Fiza...","Ek choti si baat hai. Please end tak click karti jaana.","Theek hai, sun rahi hoon"],
  ["🥺","I am really sorry, Fiza...","Un sab cheezon ke liye jin ki wajah se aap ka dil dukha. Kasam se, meri kabhi bhi intention nahi hoti ke meri wajah se aap hurt hon ya aap ki aankhon mein aansu aayein. Kabhi kabhi mujhse galti ho jati hai aur shayad mujhe us waqt realize nahi hota ke meri baat aapko kitna hurt kar sakti hai.","Next"],
  ["💗","You are very important to me...","Fiza, aap meri bestest friend ho aur mere liye bohat important ho. Mujhe pata hai aap Lahore mein akeli hain aur already bohat si cheezein aapko hurt karti hain. Main kabhi nahi chahta ke un sab ke beech meri wajah se bhi aapko hurt hona pade.","Next"],
  ["🌸","I genuinely promise...","Main genuinely promise karta hoon ke main khud ko better karne ki koshish karunga, aapki feelings ko zyada samjhunga aur apni mistakes repeat nahi karunga.","Next"],
  ["🫶","You are not alone...","Aur please kabhi ye mat sochna ke aap akeli ho. Chahe kuch bhi ho, main hamesha aapke saath khara rahunga.","Next"],
  ["🤍","From my heart...","I am really sorry, Fiza. ❤️ I hope aap meri baat samjhengi aur mujhe maaf kar dengi.","One last click"],
];

let i=0;
function render(){
  const s=screens[i];
  document.getElementById("screen").innerHTML =
    `<div class="heart">${s[0]}</div><h1>${s[1]}</h1><p>${s[2]}</p>
     <button onclick="next()">${s[3]}</button>
     ${i===0?'<div class="small">Promise, end tak jana 😌</div>':''}`;
}
function next(){
  if(i < screens.length-1){i++;render();}
  else{
    document.getElementById("screen").innerHTML =
      `<div class="heart">🥰</div><h1>For Fiza ❤️</h1>
       <p class="final">Ab bas smile kar do. 🥹❤️</p>
       <p>Sorry for everything.<br>You're genuinely important to me.</p>
       <button onclick="celebrate()">Okay, smile 😊</button>`;
  }
}
function celebrate(){
  document.getElementById("screen").innerHTML =
    `<div class="heart">❤️</div><h1>Thank You, Fiza! 🥰</h1>
     <p class="final">Ab narazgi khatam? 🫶</p>
     <p>One smile from you = mission successful. ❤️</p>`;
  for(let j=0;j<35;j++){
    const e=document.createElement("div"); e.className="confetti";
    e.textContent=["❤️","💗","🌸","✨","🥰"][Math.floor(Math.random()*5)];
    e.style.left=Math.random()*100+"vw";
    e.style.animationDelay=Math.random()*1.5+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),4500);
  }
}
render();
</script>
</body>
</html>
